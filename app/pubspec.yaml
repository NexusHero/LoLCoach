name: lol_coach
description: League of Legends in-game item coach powered by AI

publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  material_ui: ^1.2.0
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.1

dev_dependencies:
  build_runner: ^2.5.4
  custom_lint: ^0.7.6
  flutter_test:
    sdk: flutter
  msix: ^3.16.13
  riverpod_generator: ^2.6.5
  riverpod_lint: ^2.6.5
  stream_channel: any
  very_good_analysis: ^5.1.0
flutter:
  uses-material-design: true

msix_config:
  display_name: LoL Coach
  publisher_display_name: NexusHero
  identity_name: NexusHero.LoLCoach
  msix_version: 1.1.0.0
  description: League of Legends in-game item coach powered by AI
  install_certificate: false
  # To bundle the core, msix uses build/windows/x64/runner/Release as source.
  # Our build script will copy core.exe there before calling msix:create.
