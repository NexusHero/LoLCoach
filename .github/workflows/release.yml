name: Build and Release Multi-Platform Installers

on:
  push:
    tags:
      - 'v*' # Trigger this workflow only when a version tag is pushed (e.g. v1.0.0)
  workflow_dispatch:

permissions: {}

jobs:
  build-and-release:
    name: Build & Release Installer
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js (for core)
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install core Dependencies
        run: |
          cd core
          npm ci --ignore-scripts
          npm run postinstall

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'

      - name: Enable Flutter Desktop
        run: |
          flutter config --enable-windows-desktop
          flutter config --enable-macos-desktop
          flutter config --enable-linux-desktop

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: .\deployment\build_installer.ps1
        shell: powershell

      - name: Build Unix (Mac/Linux)
        if: matrix.os != 'windows-latest'
        run: |
          chmod +x ./deployment/build_unix.sh
          ./deployment/build_unix.sh
        shell: bash

      - name: Upload Windows Asset
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: dist/LoLCoach.msix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Asset
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: dist/LoLCoach-Mac.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux Asset
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: dist/LoLCoach-Linux.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

