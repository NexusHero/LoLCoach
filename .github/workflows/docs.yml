name: Docs

on:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  typedoc:
    name: Generate TypeDoc
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts && npm run postinstall
        working-directory: core

      - name: Generate TypeDoc
        run: npm run docs
        working-directory: core

      - name: Upload TypeDoc artifact
        uses: actions/upload-artifact@v7
        with:
          name: typedoc
          path: core/docs/
          retention-days: 30

  asyncapi:
    name: Validate AsyncAPI spec
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Validate asyncapi.yml
        uses: asyncapi/cli@94148460e505a8f61b08874d7613b54dffa75d9b # v6.0.0
        with:
          command: validate
          filepath: core/asyncapi.yml

