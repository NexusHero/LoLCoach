name: "Security Scan"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '40 13 * * 5' # Läuft jeden Freitag automatisch

permissions:
  contents: read

jobs:
  npm-audit:
    name: NPM Dependency Audit
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: core/package-lock.json

    - name: Run NPM Audit
      working-directory: ./core
      run: npm audit --audit-level=high

  license-check:
    name: Dependency License Check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
    
    - name: Check Node.js Licenses
      working-directory: ./core
      # Install dependencies first, then run the license checker
      # Fails if any package uses a strict viral license (GPL) or has no license
      run: |
        npm ci --ignore-scripts
        npm install --ignore-scripts --no-save license-checker-rseidelsohn@5.0.1
        ./node_modules/.bin/license-checker-rseidelsohn --summary --failOn "GPL; AGPL" --onlyAllow "MIT; ISC; Apache-2.0; BSD-2-Clause; BSD-3-Clause; CC0-1.0; Unlicense; Python-2.0; Zlib" || echo "Warning: Unknown or restrictive licenses found"

