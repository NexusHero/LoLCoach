name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  # ── core (Node.js / TypeScript) ─────────────────────────────────────────
  core:
    name: core — Node.js
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts && npm run postinstall
        working-directory: core

      - name: Run tests
        run: npm test
        working-directory: core

  # ── Flutter app (Dart) ────────────────────────────────────────────────────
  flutter:
    name: Flutter app — Dart
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Pinned so a new stable release cannot break CI unannounced. Keep in
          # sync with release.yml.
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Install dependencies
        # The committed pubspec.lock was generated with Flutter 3.44.8. Enforce it
        # again (--enforce-lockfile) once it is regenerated with 3.50.
        run: flutter pub get
        working-directory: app

      # TEMPORARY: export the lockfile resolved by Flutter 3.50 so it can be
      # committed and enforced. Removed again in the follow-up commit.
      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v7
        with:
          name: pubspec-lock-flutter-3.50.0
          path: app/pubspec.lock

      - name: Analyze
        run: flutter analyze
        working-directory: app

      - name: Run tests
        run: flutter test --exclude-tags=golden
        working-directory: app

